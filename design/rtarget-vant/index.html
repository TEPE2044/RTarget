<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>RTarget · Vant 原型</title>
<link rel="stylesheet" href="vendor/vant.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="phone"><div class="app" id="app"></div></div>

<script type="text/x-template" id="tpl-app">
  <!-- ==================== 视图层 ==================== -->
  <div class="views">

    <!-- ---------- 首页 ---------- -->
    <div v-show="tab==='home'" class="view">
      <van-nav-bar title="今天" />
      <div class="pad">
        <van-skeleton v-if="!loaded.dash" title :row="5" />
        <template v-else>
          <div class="hero-card">
            <p class="hero-label">活力值</p>
            <p class="hero-num">{{ vitality.value }}</p>
            <div class="hero-bar"><i :style="{ width: vitalityPct + '%' }"></i></div>
            <p class="hero-legend">押注：低 <b>5</b> · 中 <b>10</b> · 高 <b>20</b> · ALL IN <b>80%</b></p>
          </div>

          <div class="quick">
            <van-button type="primary" block round @click="openWizard">立新目标</van-button>
            <van-button plain block round @click="openTodoSheet(null)">记待办</van-button>
          </div>

          <van-cell-group inset title="最近">
            <van-cell v-for="f in feed" :key="f.id" :title="f.text" :label="f.time"
              :is-link="!!feedGoal(f.text)" @click="onFeedClick(f)">
              <template #icon>
                <span class="cell-lead">
                  <van-icon :name="feedIcon(f.type)" :class="'f-ic f-ic-' + f.type" />
                </span>
              </template>
            </van-cell>
          </van-cell-group>
        </template>
      </div>
    </div>

    <!-- ---------- 待办 ---------- -->
    <div v-show="tab==='todos'" class="view">
      <van-nav-bar title="待办">
        <template #right><van-icon name="plus" size="18" @click="openTodoSheet(null)" /></template>
      </van-nav-bar>
      <div class="pad">
        <van-skeleton v-if="!loaded.todos" title :row="6" />
        <template v-else>
          <van-cell-group v-if="openTodos.length" inset>
            <van-cell v-for="t in openTodos" :key="t.id" :title="t.title" clickable @click="openTodoSheet(t)">
              <template #icon>
                <span class="cell-lead">
                  <van-checkbox :model-value="false" @click.stop="toggleTodo(t)" />
                </span>
              </template>
              <template #label>
                <!-- 多次待办 = 电量格（跟真项目一个样子：格数 = 次数，亮着的还剩几次） -->
                <div v-if="t.times > 1" class="batt-line">
                  <span class="batt">
                    <i v-for="i in t.times" :key="i" :class="{ on: i <= t.left }"></i>
                  </span>
                  <span class="batt-tx">还剩 {{ t.left }} / {{ t.times }} 次</span>
                </div>
                <p v-if="t.text" class="ellip t-note">{{ t.text }}</p>
              </template>
            </van-cell>
          </van-cell-group>
          <van-empty v-else description="待办是空的 —— 想到什么就记一条" />

          <van-cell-group v-if="doneTodos.length" inset title="已勾掉">
            <van-cell v-for="t in doneTodos" :key="t.id" :title="t.title" class="muted">
              <template #icon>
                <span class="cell-lead">
                  <van-checkbox :model-value="true" @click.stop="toggleTodo(t)" />
                </span>
              </template>
            </van-cell>
          </van-cell-group>
        </template>
      </div>
    </div>

    <!-- ---------- 目标 ---------- -->
    <div v-show="tab==='goals'" class="view">
      <van-nav-bar title="目标">
        <template #right><van-icon name="plus" size="18" @click="openWizard" /></template>
      </van-nav-bar>
      <div class="pad">
        <template v-if="loaded.archives">
          <div class="a-chips">
            <button v-for="a in openArchives" :key="a.id" class="a-chip" :class="{ on: a.id === activeArchiveId }"
              @click="switchArchive(a.id)">
              <i v-if="archiveHasPending(a.id)" class="dot"></i>{{ a.name }}
            </button>
            <button class="a-chip a-chip-add" @click="newArchive">＋ 新档</button>
          </div>
          <div class="seal-row" v-if="activeArchive">
            <span v-if="openArchives.some(a => archiveHasPending(a.id))" class="seal-hint">红点 = 这个存档还有没做完的事</span>
            <van-button size="small" type="danger" plain @click="askSeal">封档</van-button>
          </div>
        </template>

        <van-skeleton v-if="!loaded.goals || !loaded.archives" title :row="5" />
        <template v-else>
          <template v-if="archiveGoals.length">
            <div v-for="g in archiveGoals" :key="g.id" class="goal-card" @click="openDetail(g.id)">
              <p class="goal-title">{{ g.title }}</p>
              <p class="goal-meta">
                <van-icon name="clock-o" />{{ g.left }} · 押 {{ g.tierLabel }} {{ g.stake }}
              </p>
              <div class="goal-duo">
                <span class="chip chip-warm">
                  <van-icon name="gift-o" /><span class="chip-t">奖励 · {{ g.reward || '没写' }}</span>
                </span>
                <span class="chip chip-cold">
                  <van-icon name="warning-o" /><span class="chip-t">惩罚 · {{ g.penalty || '没写' }}</span>
                </span>
              </div>
            </div>
          </template>
          <van-empty v-else description="这个存档还没有进行中的目标 —— 点右上角立一个" />
        </template>
      </div>
    </div>

    <!-- ---------- 愿望 ---------- -->
    <div v-show="tab==='wishes'" class="view">
      <van-nav-bar title="愿望" />
      <div class="pad">
        <van-skeleton v-if="!loaded.wishes" title :row="6" />
        <template v-else>
          <van-cell-group v-if="openWishes.length" inset>
            <van-cell v-for="w in openWishes" :key="w.id" :title="w.title"
              :label="w.attachedTo ? ('已挂给「' + w.attachedTo + '」· 兑现或判负前先别动它') : ''">
              <template #right-icon>
                <van-button size="small" plain round icon="success" @click.stop="toggleWish(w)" />
              </template>
            </van-cell>
          </van-cell-group>
          <van-empty v-else description="还没想做的事 —— 加一个" />

          <van-cell-group v-if="doneWishes.length" inset title="已实现">
            <van-cell v-for="w in doneWishes" :key="w.id" :title="w.title" :label="w.doneText" class="muted" />
          </van-cell-group>
        </template>
      </div>
    </div>

    <!-- ---------- 历史 ---------- -->
    <div v-show="tab==='history'" class="view">
      <van-nav-bar title="历史" />
      <van-skeleton v-if="!loaded.history" title :row="6" />
      <template v-else>
        <div class="pad">
          <template v-if="sealedArchives.length">
            <p class="sec">封档记录</p>
            <div v-for="a in sealedArchives" :key="a.id" class="h-card" :class="{ on: a.id === histArchiveId }"
              @click="selectHist(a.id)">
              <div class="h-head">
                <van-icon name="lock" class="h-lock" />
                <span class="h-name">{{ a.name }}</span>
                <span class="h-pill" :class="a.penalty ? 'h-pill-paid' : 'h-pill-free'">
                  {{ a.penalty ? '扣 ' + Math.abs(a.penalty) : '免费封档' }}
                </span>
              </div>
              <p class="h-time">{{ a.sealedText }}</p>
            </div>

            <p class="sec">这个存档的记录</p>
            <van-skeleton v-if="loadingRecords" title :row="4" />
            <van-cell-group v-else-if="records.length" inset>
              <van-cell v-for="(r, i) in records" :key="i" :title="r.text" :label="r.time">
                <template #icon>
                  <span class="cell-lead">
                    <van-icon :name="feedIcon(r.type)" :class="'f-ic f-ic-' + r.type" />
                  </span>
                </template>
              </van-cell>
            </van-cell-group>
            <van-empty v-else description="这个存档还没有记录" />
          </template>
          <van-empty v-else description="还没有封档记录 —— 存档封了会出现在这里" />
        </div>
      </template>
    </div>

  </div>

  <!-- ==================== 底部导航（Vant 原生 tabbar） ==================== -->
  <van-tabbar v-model="tab" :fixed="false">
    <van-tabbar-item name="home" icon="home-o">首页</van-tabbar-item>
    <van-tabbar-item name="todos" icon="todo-list-o">待办</van-tabbar-item>
    <van-tabbar-item name="goals" icon="aim">目标</van-tabbar-item>
    <van-tabbar-item name="wishes" icon="star-o">愿望</van-tabbar-item>
    <van-tabbar-item name="history" icon="clock-o">历史</van-tabbar-item>
  </van-tabbar>

  <!-- ==================== 目标详情（全屏） ==================== -->
  <van-popup v-model:show="detailShow" position="right" :style="{ width: '100%', height: '100%' }" :duration="0.25" :close-on-click-overlay="false">
    <div class="d-page" v-if="detail">
      <van-nav-bar title="目标" left-arrow @click-left="detailShow = false" />
      <div class="d-body">
        <h2 class="hero">{{ detail.title }}</h2>
        <div class="d-meta">
          <van-icon name="clock-o" /><span>{{ detail.left }}</span>
          <van-tag type="primary" plain>押 {{ detail.tierLabel }} {{ detail.stake }}</van-tag>
        </div>

        <div class="panel panel-warm">
          <div class="p-head"><van-icon name="gift-o" />做到了 · 奖励</div>
          <p class="p-text">{{ detail.reward || '（没写）' }}</p>
          <p class="p-sub">达成那一刻就算兑现，自动从愿望单划掉。</p>
        </div>
        <div class="panel panel-cold">
          <div class="p-head"><van-icon name="warning-o" />做不到 · 惩罚</div>
          <p class="p-text">{{ detail.penalty || '（没写）' }}</p>
          <p class="p-sub">扣 {{ detail.stake }} 活力值 · 目标关闭</p>
        </div>

        <div class="d-exec-label"><van-icon name="edit" />怎么做</div>
        <van-cell-group inset>
          <van-field v-model="detail.exec" type="textarea" autosize rows="6"
            placeholder="写计划、写步骤、想到什么写什么……支持 Markdown" />
        </van-cell-group>
      </div>
      <div class="foot">
        <van-button block plain type="danger" @click="askGiveUp">放弃</van-button>
        <van-button block type="primary" @click="completeGoal">完成</van-button>
      </div>
    </div>
  </van-popup>

  <!-- ==================== 立项向导（6 步换页） ==================== -->
  <van-popup v-model:show="wz.show" position="bottom" :style="{ height: '100%' }" :duration="0.25" :close-on-click-overlay="false">
    <div class="wz-page" v-if="wz">
      <van-nav-bar :title="'第 ' + wz.step + ' / 6 页'" left-arrow @click-left="closeWizard" />
      <div class="dots"><i v-for="n in 6" :key="n" :class="{ on: n === wz.step }"></i></div>
      <div class="wz-body">

        <!-- ① 目标 -->
        <template v-if="wz.step === 1">
          <h3 class="wz-h">要立一个什么目标？</h3>
          <p class="wz-sub">从待办里挑一条，或者临时起意写一个。</p>
          <div class="segline">
            <van-button :type="wz.source === 'todo' ? 'primary' : 'default'"
              :plain="wz.source !== 'todo'" @click="wz.source = 'todo'">从待办挑</van-button>
            <van-button :type="wz.source === 'free' ? 'primary' : 'default'"
              :plain="wz.source !== 'free'" @click="wz.source = 'free'">自己写</van-button>
          </div>
          <van-radio-group v-if="wz.source === 'todo'" v-model="wz.pickId">
            <van-cell-group v-if="openTodos.length" inset>
              <van-cell v-for="t in openTodos" :key="t.id" :title="t.title" clickable @click="wz.pickId = t.id">
                <template #right-icon><van-radio :name="t.id" /></template>
              </van-cell>
            </van-cell-group>
            <van-empty v-else description="待办是空的 —— 切到「自己写」吧" />
          </van-radio-group>
          <van-cell-group v-else inset>
            <van-field v-model="wz.title" label="目标" placeholder="比如：把阳台收拾出来" />
          </van-cell-group>
        </template>

        <!-- ② 死线 + 押注 -->
        <template v-else-if="wz.step === 2">
          <h3 class="wz-h">什么时候做到？押多少？</h3>
          <p class="wz-sub">到点没做到就算判负 —— 押多少，输了就扣多少。</p>
          <div class="chips">
            <van-button v-for="q in quickDues" :key="q.label" size="small" round
              :type="wz.dueLabel === q.label ? 'primary' : 'default'"
              :plain="wz.dueLabel !== q.label" @click="pickDue(q)">{{ q.label }}</van-button>
            <van-button size="small" round plain @click="openPicker">自定义…</van-button>
          </div>
          <van-cell-group inset>
            <van-cell title="死线" :value="wzDueText" is-link @click="openPicker" />
          </van-cell-group>
          <van-cell-group inset title="押注档位">
            <div class="segline segline-pad">
              <van-button :type="wz.tier === '低' ? 'primary' : 'default'"
                :plain="wz.tier !== '低'" @click="wz.tier = '低'">低 5</van-button>
              <van-button :type="wz.tier === '中' ? 'primary' : 'default'"
                :plain="wz.tier !== '中'" @click="wz.tier = '中'">中 10</van-button>
              <van-button :type="wz.tier === '高' ? 'primary' : 'default'"
                :plain="wz.tier !== '高'" @click="wz.tier = '高'">高 20</van-button>
              <van-button :type="wz.tier === 'allin' ? 'primary' : 'default'"
                :plain="wz.tier !== 'allin'" @click="wz.tier = 'allin'">ALL IN</van-button>
            </div>
            <div class="legend2">赢了 +{{ wzStake }} / 输了 −{{ wzStake }} 活力值</div>
          </van-cell-group>
        </template>

        <!-- ③ 奖励 -->
        <template v-else-if="wz.step === 3">
          <h3 class="wz-h">做到了，奖励是什么？</h3>
          <p class="wz-sub">从愿望单挑一个 —— 达成那一刻就算兑现；也可以临时写一句。</p>
          <div class="segline">
            <van-button :type="wz.rewardFrom === 'wish' ? 'primary' : 'default'"
              :plain="wz.rewardFrom !== 'wish'" @click="wz.rewardFrom = 'wish'">从愿望挑</van-button>
            <van-button :type="wz.rewardFrom === 'free' ? 'primary' : 'default'"
              :plain="wz.rewardFrom !== 'free'" @click="wz.rewardFrom = 'free'">写一句</van-button>
          </div>
          <van-radio-group v-if="wz.rewardFrom === 'wish'" v-model="wz.rewardPick">
            <van-cell-group v-if="openWishes.length" inset>
              <van-cell v-for="w in openWishes" :key="w.id" :title="w.title"
                :label="w.attachedTo ? '已挂给别的目标' : ''" clickable @click="wz.rewardPick = w.id">
                <template #right-icon><van-radio :name="w.id" /></template>
              </van-cell>
            </van-cell-group>
            <van-empty v-else description="愿望单是空的 —— 切到「写一句」吧" />
          </van-radio-group>
          <van-cell-group v-else inset>
            <van-field v-model="wz.reward" label="奖励" placeholder="比如：看一场电影" />
          </van-cell-group>
        </template>

        <!-- ④ 惩罚 -->
        <template v-else-if="wz.step === 4">
          <h3 class="wz-h">做不到，罚自己什么？</h3>
          <p class="wz-sub">写一句就好，也可以留空 —— 系统的处理是固定的。</p>
          <van-cell-group inset>
            <van-field v-model="wz.penalty" label="惩罚" placeholder="比如：手洗羽绒服" />
          </van-cell-group>
          <van-notice-bar wrapable :scrollable="false" left-icon="info-o"
            :text="'做不到会：扣 ' + wzStake + ' 活力值' + (wz.source === 'todo' ? '，并退回待办（次数不动）' : '') + '，目标关闭。没有第二阶段，也没有补做。'" />
        </template>

        <!-- ⑤ 怎么做 -->
        <template v-else-if="wz.step === 5">
          <h3 class="wz-h">具体怎么做？</h3>
          <p class="wz-sub">像手机笔记那样写：步骤、清单、想法都行，支持 Markdown，之后随时补。</p>
          <van-cell-group inset>
            <van-field v-model="wz.exec" type="textarea" autosize rows="8" placeholder="第一步……" />
          </van-cell-group>
        </template>

        <!-- ⑥ 确认 -->
        <template v-else>
          <h3 class="wz-h">最后看一眼</h3>
          <p class="wz-sub">确认后就不能改了 —— 到点见分晓。</p>
          <van-cell-group inset>
            <van-cell title="目标" :value="wzTitle" />
            <van-cell title="死线" :value="wzDueText" />
            <van-cell title="押注" :value="wzTierLabel + ' · 输赢 ' + wzStake + ' 分'" />
            <van-cell title="奖励" :value="wzReward || '（没写）'" />
            <van-cell title="惩罚" :value="wz.penalty || '（没写）'" />
            <van-cell title="怎么做" :value="wz.exec.trim() ? '已写 ' + wz.exec.trim().length + ' 字' : '（还没写，立完再写也行）'" />
          </van-cell-group>
          <van-notice-bar wrapable :scrollable="false" left-icon="info-o"
            :text="'做到：+' + wzStake + ' 活力值，奖励当场兑现。做不到：−' + wzStake + ' 活力值' + (wz.source === 'todo' ? '，退回待办' : '') + '，目标关闭。'" />
        </template>

      </div>
      <div class="foot">
        <van-button block plain :disabled="wz.step === 1" @click="wzStep(-1)">上一步</van-button>
        <van-button block type="primary" :disabled="!wzValid" @click="wzNext">{{ wz.step === 6 ? '押注设立' : '继续' }}</van-button>
      </div>
    </div>
  </van-popup>

  <!-- 日期 / 时刻选择 -->
  <van-popup v-model:show="wz.pickerShow" position="bottom" round>
    <van-date-picker v-if="wz.pickerMode === 'date'" v-model="wz.pickerDate" :min-date="minDate" :max-date="maxDate"
      title="选日期" @confirm="onDateConfirm" @cancel="wz.pickerShow = false" />
    <van-time-picker v-else v-model="wz.pickerTime" title="选时刻"
      @confirm="onTimeConfirm" @cancel="wz.pickerShow = false" />
  </van-popup>

  <!-- ==================== 待办编辑（底部抽屉） ==================== -->
  <van-popup v-model:show="sheet.show" position="bottom" round>
    <div class="sheet">
      <div class="sheet-head">{{ sheet.isNew ? '记一条待办' : '编辑待办' }}</div>
      <van-field v-model="sheet.title" label="标题" placeholder="要做什么" />
      <van-field v-model="sheet.text" label="内容" type="textarea" autosize rows="4" placeholder="写计划、写细节……支持 Markdown" />
      <div class="foot">
        <van-button block plain @click="sheet.show = false">取消</van-button>
        <van-button block type="primary" @click="saveTodo">确定</van-button>
      </div>
    </div>
  </van-popup>

  <!-- ==================== 通用确认（Vant 对话框） ==================== -->
  <van-dialog v-model:show="confirm.show" :title="confirm.title" :message="confirm.text"
    show-cancel-button :confirm-button-text="confirm.okText" @confirm="confirmOk" />

  <!-- ==================== 轻提示（留在手机框内） ==================== -->
  <van-toast v-model:show="toastState.show" :message="toastState.msg" position="bottom" />
</script>

<script src="vendor/vue.global.prod.js"></script>
<script src="vendor/vant.min.js"></script>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
