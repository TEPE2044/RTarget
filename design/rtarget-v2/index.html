<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<title>RTarget · 原型</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body data-view="home">
<div class="phone">
<div class="app">

  <main class="view-stack">

    <!-- ================= 首页 ================= -->
    <section class="view" data-view="home">
      <header class="view-head">
        <div>
          <p class="eyebrow">RTARGET</p>
          <h1 class="view-title">今天</h1>
        </div>
      </header>

      <div class="card vitality" id="vitalityCard"></div>

      <div class="quick">
        <button class="btn btn-block" data-act="open-wizard">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
          立新目标
        </button>
        <button class="btn btn-ghost btn-block" data-act="new-todo">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5h9"/><path d="M16.8 3.7a2.3 2.3 0 0 1 3.2 3.2L7 19.9l-4.2 1.1L3.9 16.8Z"/></svg>
          记待办
        </button>
      </div>

      <div class="sec-head"><h2 class="sec-title">最近</h2></div>
      <div class="feed" id="feedList"></div>
    </section>

    <!-- ================= 待办 ================= -->
    <section class="view" data-view="todos">
      <header class="view-head">
        <div>
          <p class="eyebrow">清单</p>
          <h1 class="view-title">待办</h1>
        </div>
        <button class="icon-btn" data-act="new-todo" aria-label="记一条待办">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </header>
      <div class="list" id="todoList"></div>
    </section>

    <!-- ================= 目标 ================= -->
    <section class="view" data-view="goals">
      <header class="view-head">
        <div>
          <p class="eyebrow">正在押注</p>
          <h1 class="view-title">目标</h1>
        </div>
        <button class="icon-btn" data-act="open-wizard" aria-label="立一个新目标">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        </button>
      </header>
      <div class="list" id="goalList"></div>
    </section>

    <!-- ================= 愿望 ================= -->
    <section class="view" data-view="wishes">
      <header class="view-head">
        <div>
          <p class="eyebrow">想要</p>
          <h1 class="view-title">愿望</h1>
        </div>
      </header>
      <div class="list" id="wishList"></div>
      <div class="sec-head" id="wishDoneHead" hidden><h2 class="sec-title">已实现</h2></div>
      <div class="list" id="wishDoneList"></div>
    </section>

    <!-- ================= 历史 ================= -->
    <section class="view" data-view="history">
      <header class="view-head">
        <div>
          <p class="eyebrow">存档</p>
          <h1 class="view-title">历史</h1>
        </div>
      </header>
      <div class="chips-row" id="archiveChips"></div>
      <div class="list" id="archiveRecords"></div>
      <div id="sealBox"></div>
    </section>

  </main>

  <!-- ================= 底部导航（冻结，勿逐页重画） ================= -->
  <nav class="tabbar">
    <button class="tab" data-view="home">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 20Z"/><path d="M9 21.5V13h6v8.5"/></svg>
      <span>首页</span>
    </button>
    <button class="tab" data-view="todos">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 1.6 1.6L7.5 5.5"/><path d="m3 17 1.6 1.6 2.9-3.1"/><path d="M12 7h9"/><path d="M12 17h9"/></svg>
      <span>待办</span>
    </button>
    <button class="tab" data-view="goals">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></svg>
      <span>目标</span>
    </button>
    <button class="tab" data-view="wishes">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5 13.6 9l4.5 1.6-4.5 1.6L12 16.7l-1.6-4.5L5.9 10.6 10.4 9Z"/><path d="M18.5 3.5v3M17 5h3"/></svg>
      <span>愿望</span>
    </button>
    <button class="tab" data-view="history">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 1.8"/></svg>
      <span>历史</span>
    </button>
  </nav>

  <!-- ================= 目标详情（全屏） ================= -->
  <div class="overlay" id="detailOverlay" hidden>
    <div class="page-topbar">
      <button class="icon-btn" data-act="detail-back" aria-label="返回">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
      </button>
      <span class="topbar-title">目标</span>
      <span class="topbar-pad"></span>
    </div>
    <div class="page-body" id="detailBody"></div>
    <div class="page-foot">
      <button class="btn btn-ghost btn-block" data-act="give-up">放弃</button>
      <button class="btn btn-block" data-act="complete">完成</button>
    </div>
  </div>

  <!-- ================= 立项向导（6 步换页） ================= -->
  <div class="overlay" id="wizardOverlay" hidden>
    <div class="page-topbar">
      <button class="icon-btn" data-act="wz-back" aria-label="返回">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m14.5 6-6 6 6 6"/></svg>
      </button>
      <div class="dots" id="wzDots"></div>
      <span class="topbar-tag" id="wzTag">1 / 6</span>
    </div>
    <div class="page-body" id="wzBody"></div>
    <div class="page-foot">
      <button class="btn btn-ghost btn-block" data-act="wz-prev">上一步</button>
      <button class="btn btn-block" id="wzNext" data-act="wz-next">继续</button>
    </div>
  </div>

  <!-- ================= 待办编辑（底部抽屉） ================= -->
  <div class="sheet-wrap" id="todoSheet" hidden>
    <div class="backdrop" data-act="sheet-cancel"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h3 class="sheet-title" id="sheetTitle">编辑待办</h3>
      <label class="field">
        <span class="field-label">标题</span>
        <input class="input" id="sheetInput" placeholder="要做什么" />
      </label>
      <label class="field">
        <span class="field-label">内容</span>
        <textarea class="textarea" id="sheetText" rows="5" placeholder="写计划、写细节……支持 Markdown"></textarea>
      </label>
      <div class="sheet-actions">
        <button class="btn btn-ghost btn-block" data-act="sheet-cancel">取消</button>
        <button class="btn btn-block" data-act="sheet-save">确定</button>
      </div>
    </div>
  </div>

  <!-- ================= 通用确认（底部抽屉） ================= -->
  <div class="sheet-wrap" id="confirmSheet" hidden>
    <div class="backdrop" data-act="confirm-cancel"></div>
    <div class="sheet">
      <div class="grab"></div>
      <h3 class="sheet-title" id="confirmTitle">确认</h3>
      <p class="sheet-text" id="confirmText"></p>
      <div class="sheet-actions">
        <button class="btn btn-ghost btn-block" data-act="confirm-cancel">取消</button>
        <button class="btn btn-block" id="confirmOk" data-act="confirm-ok">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

</div>
</div>
<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
